<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>BLUE LOCK — Ego Rush</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100%;
    height:100%;
}

body{

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    background:
        radial-gradient(
            circle at 50% 45%,
            #0c2948 0%,
            #061321 35%,
            #02070d 70%,
            #010307 100%
        );

    color:white;

    overflow:hidden;
}


/* =====================================================
   FUNDO
===================================================== */

.background{

    position:fixed;

    inset:0;

    overflow:hidden;

    z-index:0;
}


/* Grade */

.grid{

    position:absolute;

    inset:-50%;

    background-image:
        linear-gradient(
            rgba(20,130,255,.07) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(20,130,255,.07) 1px,
            transparent 1px
        );

    background-size:60px 60px;

    transform:
        perspective(500px)
        rotateX(60deg)
        translateY(100px);

    animation:gridMove 8s linear infinite;

    opacity:.5;
}

@keyframes gridMove{

    from{
        transform:
            perspective(500px)
            rotateX(60deg)
            translateY(0);
    }

    to{
        transform:
            perspective(500px)
            rotateX(60deg)
            translateY(60px);
    }

}


/* Luz central */

.glow{

    position:absolute;

    width:700px;
    height:700px;

    left:50%;
    top:50%;

    transform:translate(-50%,-50%);

    background:
        radial-gradient(
            circle,
            rgba(0,145,255,.20),
            rgba(0,100,255,.08) 35%,
            transparent 70%
        );

    filter:blur(20px);

    animation:pulse 4s ease-in-out infinite;

}

@keyframes pulse{

    0%,
    100%{
        transform:
            translate(-50%,-50%)
            scale(.9);

        opacity:.7;
    }

    50%{
        transform:
            translate(-50%,-50%)
            scale(1.15);

        opacity:1;
    }

}


/* Linhas de energia */

.energy{

    position:absolute;

    width:120%;
    height:2px;

    background:
        linear-gradient(
            90deg,
            transparent,
            #1683ff,
            #00d9ff,
            transparent
        );

    opacity:.25;

    transform:rotate(-25deg);

    animation:energyMove 5s linear infinite;
}

.energy.one{
    top:25%;
    left:-10%;
}

.energy.two{
    top:65%;
    left:-20%;

    animation-delay:2s;
}

@keyframes energyMove{

    from{
        transform:
            translateX(-30%)
            rotate(-25deg);
    }

    to{
        transform:
            translateX(30%)
            rotate(-25deg);
    }

}


/* =====================================================
   PARTÍCULAS
===================================================== */

.particles{

    position:absolute;

    inset:0;

}

.particle{

    position:absolute;

    width:3px;
    height:3px;

    border-radius:50%;

    background:#55b5ff;

    box-shadow:
        0 0 10px #1683ff;

    animation:
        floatParticle
        linear
        infinite;

    opacity:.5;
}

@keyframes floatParticle{

    from{
        transform:
            translateY(110vh)
            scale(.5);

        opacity:0;
    }

    10%{
        opacity:.7;
    }

    90%{
        opacity:.7;
    }

    to{
        transform:
            translateY(-10vh)
            scale(1);

        opacity:0;
    }

}


/* =====================================================
   CONTEÚDO
===================================================== */

.container{

    position:relative;

    z-index:5;

    width:100%;
    height:100%;

    display:flex;

    align-items:center;
    justify-content:center;

    text-align:center;

    padding:20px;

}


/* =====================================================
   LOGO
===================================================== */

.logo-area{

    animation:
        logoEntrance
        1.3s
        cubic-bezier(.17,.67,.25,1.2)
        forwards;

    opacity:0;

}

@keyframes logoEntrance{

    from{
        opacity:0;

        transform:
            translateY(-50px)
            scale(.85);
    }

    to{
        opacity:1;

        transform:
            translateY(0)
            scale(1);
    }

}


.logo-small{

    font-size:18px;

    font-weight:900;

    letter-spacing:8px;

    color:#55b5ff;

    margin-bottom:12px;

    text-shadow:
        0 0 20px rgba(0,150,255,.7);

}


.logo{

    font-size:
        clamp(
            55px,
            11vw,
            125px
        );

    font-weight:1000;

    font-style:italic;

    letter-spacing:-5px;

    line-height:.85;

    color:white;

    text-shadow:
        0 0 5px white,
        0 0 20px rgba(0,140,255,.8),
        0 0 50px rgba(0,100,255,.4);

}


.logo span{

    color:#1683ff;

    text-shadow:
        0 0 10px #1683ff,
        0 0 30px #1683ff,
        0 0 60px rgba(0,130,255,.7);

}


.subtitle{

    margin-top:18px;

    font-size:
        clamp(
            13px,
            2vw,
            18px
        );

    letter-spacing:6px;

    color:#91a8c0;

    font-weight:700;

}


/* =====================================================
   EGO
===================================================== */

.ego{

    margin-top:50px;

    animation:
        contentEntrance
        1s
        .6s
        ease
        forwards;

    opacity:0;

}

@keyframes contentEntrance{

    from{
        opacity:0;

        transform:translateY(30px);
    }

    to{
        opacity:1;

        transform:translateY(0);
    }

}


.enter{

    font-size:12px;

    letter-spacing:7px;

    color:#6f8ba6;

    margin-bottom:12px;

    font-weight:900;

}


.ego-title{

    font-size:
        clamp(
            26px,
            5vw,
            55px
        );

    font-weight:1000;

    font-style:italic;

    letter-spacing:3px;

    margin-bottom:30px;

}


/* =====================================================
   BOTÕES
===================================================== */

.buttons{

    display:flex;

    justify-content:center;

    align-items:center;

    gap:14px;

    flex-wrap:wrap;

}


.btn{

    position:relative;

    min-width:180px;

    padding:16px 28px;

    border:none;

    cursor:pointer;

    font-size:13px;

    font-weight:1000;

    letter-spacing:2px;

    color:white;

    background:#0a1625;

    border:1px solid #24435f;

    clip-path:
        polygon(
            0 0,
            94% 0,
            100% 30%,
            100% 100%,
            6% 100%,
            0 70%
        );

    transition:
        .25s;

    overflow:hidden;

}


.btn::before{

    content:"";

    position:absolute;

    inset:0;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,.12),
            transparent
        );

    transform:
        translateX(-100%);

    transition:.5s;

}


.btn:hover::before{

    transform:
        translateX(100%);

}


.btn:hover{

    transform:
        translateY(-4px);

    border-color:#1683ff;

    box-shadow:
        0 10px 30px
        rgba(22,131,255,.25);

}


.btn-primary{

    min-width:250px;

    padding:20px 40px;

    font-size:16px;

    background:
        linear-gradient(
            135deg,
            #126fe8,
            #084aa5
        );

    border-color:#55b5ff;

    box-shadow:
        0 0 25px
        rgba(22,131,255,.35);

}


.btn-primary:hover{

    background:
        linear-gradient(
            135deg,
            #1683ff,
            #0b5ed0
        );

    box-shadow:
        0 0 40px
        rgba(22,131,255,.55);

}


/* =====================================================
   STATUS
===================================================== */

.status{

    margin-top:35px;

    display:flex;

    justify-content:center;

    gap:25px;

    color:#627991;

    font-size:10px;

    letter-spacing:2px;

    font-weight:800;

}


.status-item{

    display:flex;

    align-items:center;

    gap:7px;

}


.dot{

    width:6px;
    height:6px;

    border-radius:50%;

    background:#27ff88;

    box-shadow:
        0 0 10px #27ff88;

}


/* =====================================================
   CANTO
===================================================== */

.corner{

    position:absolute;

    z-index:10;

    color:#456078;

    font-size:9px;

    letter-spacing:2px;

    font-weight:900;

}

.corner.top-left{

    top:25px;
    left:30px;

}

.corner.top-right{

    top:25px;
    right:30px;

}

.corner.bottom-left{

    bottom:25px;
    left:30px;

}

.corner.bottom-right{

    bottom:25px;
    right:30px;

}


/* =====================================================
   LOADING
===================================================== */

.loading{

    position:fixed;

    inset:0;

    background:#01050a;

    z-index:100;

    display:flex;

    align-items:center;
    justify-content:center;

    flex-direction:column;

    transition:
        opacity .7s,
        visibility .7s;

}


.loading.hide{

    opacity:0;

    visibility:hidden;

}


.loading-logo{

    font-size:40px;

    font-weight:1000;

    font-style:italic;

    letter-spacing:-2px;

}


.loading-logo span{

    color:#1683ff;

}


.loading-bar{

    width:220px;

    height:3px;

    background:#102234;

    margin-top:20px;

    overflow:hidden;

}


.loading-progress{

    width:0%;

    height:100%;

    background:
        linear-gradient(
            90deg,
            #1683ff,
            #00d9ff
        );

    animation:
        loading 1.2s
        ease
        forwards;

}


@keyframes loading{

    from{
        width:0;
    }

    to{
        width:100%;
    }

}


/* =====================================================
   RESPONSIVO
===================================================== */

@media(max-width:600px){

    .logo{

        font-size:60px;

        letter-spacing:-3px;

    }

    .logo-small{

        font-size:13px;

        letter-spacing:5px;

    }

    .subtitle{

        font-size:10px;

        letter-spacing:3px;

    }

    .ego{

        margin-top:35px;

    }

    .ego-title{

        font-size:28px;

    }

    .buttons{

        flex-direction:column;

    }

    .btn,
    .btn-primary{

        width:280px;

    }

    .status{

        gap:12px;

        flex-direction:column;

    }

    .corner{

        display:none;

    }

}

</style>

</head>


<body>


<!-- =====================================================
     LOADING
===================================================== -->

<div
    class="loading"
    id="loading"
>

    <div class="loading-logo">
        BLUE <span>LOCK</span>
    </div>

    <div class="loading-bar">

        <div
            class="loading-progress"
        ></div>

    </div>

</div>


<!-- =====================================================
     FUNDO
===================================================== -->

<div class="background">

    <div class="grid"></div>

    <div class="glow"></div>

    <div class="energy one"></div>

    <div class="energy two"></div>

    <div
        class="particles"
        id="particles"
    ></div>

</div>


<!-- =====================================================
     CANTOS
===================================================== -->

<div class="corner top-left">
    PROJECT EGO
</div>

<div class="corner top-right">
    BLUELK // 001
</div>

<div class="corner bottom-left">
    SYSTEM ONLINE
</div>

<div class="corner bottom-right">
    EGO RUSH
</div>


<!-- =====================================================
     CONTEÚDO PRINCIPAL
===================================================== -->

<main class="container">

    <div>

        <div class="logo-area">

            <div class="logo-small">
                PROJECT
            </div>

            <div class="logo">
                BLUE <span>LOCK</span>
            </div>

            <div class="subtitle">
                EGO RUSH
            </div>

        </div>


        <div class="ego">

            <div class="enter">
                WELCOME TO THE BLUE LOCK PROJECT
            </div>

            <div class="ego-title">
                ENTER THE EGO
            </div>


            <div class="buttons">

                <button
                    class="btn btn-primary"
                    onclick="startGame()"
                >
                    ▶ &nbsp; JOGAR
                </button>

                <button
                    class="btn"
                    onclick="openLog()"
                >
                    📜 &nbsp; ATUALIZAÇÕES
                </button>

            </div>


            <div class="status">

                <div class="status-item">

                    <span class="dot"></span>

                    SYSTEM ONLINE

                </div>

                <div class="status-item">

                    VERSION 1.3.0

                </div>

                <div class="status-item">

                    EGO RUSH

                </div>

            </div>

        </div>

    </div>

</main>


<script>

/* =====================================================
   LOADING
===================================================== */

window.addEventListener(
    "load",
    () => {

        setTimeout(
            () => {

                document
                    .getElementById("loading")
                    .classList
                    .add("hide");

            },
            1300
        );

    }
);


/* =====================================================
   PARTÍCULAS
===================================================== */

const particleContainer =
    document.getElementById(
        "particles"
    );


for(
    let i = 0;
    i < 45;
    i++
){

    const particle =
        document.createElement(
            "div"
        );

    particle.className =
        "particle";

    particle.style.left =
        Math.random() * 100 + "%";

    particle.style.animationDuration =
        (5 + Math.random() * 9) + "s";

    particle.style.animationDelay =
        Math.random() * 8 + "s";

    particle.style.opacity =
        .2 + Math.random() * .6;

    const size =
        1 + Math.random() * 3;

    particle.style.width =
        size + "px";

    particle.style.height =
        size + "px";

    particleContainer
        .appendChild(
            particle
        );

}


/* =====================================================
   ENTRAR NO JOGO
===================================================== */

function startGame(){

    document.body.style.transition =
        "opacity .5s";

    document.body.style.opacity =
        "0";

    setTimeout(
        () => {

            window.location.href =
                "index.html";

        },
        500
    );

}


/* =====================================================
   LOG
===================================================== */

function openLog(){

    window.location.href =
        "index.html#log";

}


/* =====================================================
   TECLA ENTER
===================================================== */

document.addEventListener(
    "keydown",
    function(event){

        if(
            event.key === "Enter"
        ){

            startGame();

        }

    }
);

</script>

</body>

</html>
